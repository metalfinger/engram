<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Engram</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!--
      This is the popup Tauri shows when the tray icon is left-clicked
      (see src-tauri/src/popup.rs). It renders entirely from data handed
      over the `invoke` IPC bridge in main.js — this page never loads
      engram.metalfinger.xyz and never sees the bearer token.
    -->
    <div id="app">
      <header class="me-row" id="me-row">
        <div class="avatar" id="me-avatar"></div>
        <div class="me-text">
          <div class="me-handle" id="me-handle">Engram Tray</div>
          <div class="me-status" id="me-status"></div>
        </div>
        <div class="me-actions">
          <button class="icon-btn" id="btn-invisible" title="Appear invisible" aria-pressed="false">&#128065;</button>
          <button class="icon-btn" id="btn-settings" title="Open config folder">&#9881;</button>
          <button class="icon-btn" id="btn-sign-out" title="Sign out">&#9211;</button>
        </div>
      </header>

      <section id="signed-out-panel" class="signed-out-panel" hidden>
        <p>You're signed out.</p>
        <button class="primary-btn" id="btn-sign-in">Sign in&hellip;</button>
      </section>

      <main id="signed-in-panel">
        <section class="section">
          <h2 class="section-title">Working now</h2>
          <div id="team-list" class="team-list"></div>
          <p id="team-empty" class="empty-state" hidden>Nobody active right now</p>
        </section>

        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Notifications <span id="unread-badge" class="badge" hidden>0</span></h2>
            <button id="btn-mark-read" class="link-btn" disabled>Mark all read</button>
          </div>
          <div id="notif-list" class="notif-list"></div>
          <p id="notif-empty" class="empty-state" hidden>You're all caught up</p>
        </section>
      </main>

      <footer class="footer">
        <button class="link-btn" id="btn-open-dashboard">Open Dashboard</button>
        <span class="dot">&middot;</span>
        <button class="link-btn" id="btn-open-rooms">Open Rooms</button>
      </footer>
    </div>
    <script src="main.js"></script>
  </body>
</html>
