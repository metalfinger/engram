<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Engram Notifications</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fff;
        color: #1b1b1f;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1f22;
          color: #e7e7ea;
        }
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(127, 127, 127, 0.25);
      }
      header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
      }
      #list {
        max-height: 320px;
        overflow-y: auto;
      }
      .item {
        padding: 8px 12px;
        border-bottom: 1px solid rgba(127, 127, 127, 0.12);
      }
      .item .kind {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        opacity: 0.6;
      }
      .item .body {
        margin: 2px 0;
        word-wrap: break-word;
      }
      .item .at {
        font-size: 11px;
        opacity: 0.5;
      }
      .empty,
      .signed-out {
        padding: 20px 12px;
        text-align: center;
        opacity: 0.7;
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid rgba(127, 127, 127, 0.25);
      }
      button,
      a.button {
        flex: 1;
        text-align: center;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
        box-sizing: border-box;
      }
      button:hover,
      a.button:hover {
        background: rgba(127, 127, 127, 0.15);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      a.primary {
        background: #3a5cd6;
        border-color: #3a5cd6;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Engram</h1>
      <span id="badge"></span>
    </header>
    <div id="list"></div>
    <footer id="footer"></footer>
    <script src="popup.js"></script>
  </body>
</html>
