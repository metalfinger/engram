[project]
name = "engram-server"
version = "0.1.0"
description = "Engram — kb_* MCP server + transparency explorer over the brain OKF bundle"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "anyio>=4.4",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0.1",
    "httpx>=0.27",
    "markdown>=3.6",
    "PyJWT[crypto]>=2.9",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24"]

[project.scripts]
engram-server = "engram_server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engram_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
