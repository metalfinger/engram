# Engram Tray — desktop builds for every OS, without owning every OS.
#
# Push a tag like `desktop-v0.1.0` and this matrix builds:
#   - Windows .msi            (windows-latest)
#   - macOS .dmg universal    (macos-latest, aarch64 + x86_64)
#   - Linux .AppImage + .deb  (ubuntu-22.04)
# and attaches all of them to a GitHub Release for that tag — the Setup page's
# "latest release" link then serves real installers. Public repo = free runners.

name: desktop
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch: {}

jobs:
  build:
    permissions:
      contents: write # create the release + upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux system deps (webkit2gtk & friends)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - name: Build + release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: clients/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Engram Tray ${{ github.ref_name }}"
          releaseBody: >
            Native desktop notifications + live team roster in your tray.
            Windows: run the .msi (SmartScreen: More info → Run anyway).
            macOS: open the .dmg, drag to Applications, right-click → Open the
            first time (unsigned). Sign in from the tray icon — no tokens.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
